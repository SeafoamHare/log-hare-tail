name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is now out of date
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build every Dockerfile stage once and fill the cache the checks below read from
  image:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  checks:
    name: linux / ${{ matrix.check }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Let every combination finish, so a failure shows which compiler or sanitizer it belongs to
      fail-fast: false
      matrix:
        include:
          - { check: gcc, cmd: "cmake --workflow --preset gcc" }
          - { check: clang, cmd: "cmake --workflow --preset clang" }
          # TSan and ASan runtimes cannot share one binary, so each gets its own job
          - { check: tsan, cmd: "cmake --workflow --preset tsan" }
          - { check: asan, cmd: "cmake --workflow --preset asan" }
          - { check: format, cmd: "scripts/format.sh --check" }
          - { check: tidy, cmd: "cmake --workflow --preset tidy" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: log-hare-tail:dev
          cache-from: type=gha,scope=ci
      # High ASLR entropy on recent kernels can break TSan ("unexpected memory mapping").
      # The container shares the host kernel, so this has to be set on the runner
      - name: Lower ASLR entropy for TSan
        if: matrix.check == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run ${{ matrix.check }}
        run: docker run --rm -v "$PWD:/workspace" log-hare-tail:dev ${{ matrix.cmd }}

  # Native, outside Docker, to keep macOS (Apple clang, libc++, Homebrew packages) covered
  macos:
    name: macos / clang
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Logger
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja nlohmann-json
      - name: Build and test
        run: cmake --workflow --preset clang
